<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Art</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="index.css">
  <script>
    // DEV SWITCH: true = always play the intro on every reload (for working on the
    // animation itself); false = normal behavior, intro plays once per browser session.
    // Flip back to false when done testing.
    const DEV_ALWAYS_PLAY_INTRO = false;

    // set before body renders, so a repeat visit this session never paints the intro at all
    if (!DEV_ALWAYS_PLAY_INTRO && sessionStorage.getItem('introPlayed')) {
      document.documentElement.classList.add('skip-intro');
    }
  </script>
</head>
<body>

  <div id="menu-bar"></div>

  <button id="menu-toggle" type="button" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>

  <nav id="drawer"></nav>

  <div class="home">
    <div class="grid-box">
      <div class="frame-box"></div>
      <img class="grid-fade-image" src="images/images-small/Network of Bales (after Duchamp)-small.webp" alt="">
      <div class="onkle-line"></div>
      <div class="h-line" data-letter="u"></div>
      <div class="h-line" data-letter="r"></div>
      <div class="h-line" data-letter="i"></div>
      <div class="h-line" data-letter="c"></div>
      <div class="h-line" data-letter="e"></div>
    </div>

    <header id="intro">
      <div id="text">
        <div>
          <span class="big">m</span>
          <div class="small"><span class="letter-a">a</span><br><span class="letter-u">u</span><br><span class="letter-r">r</span><br><span class="letter-i">i</span><br><span class="letter-c">c</span><br><span class="letter-e">e</span></div>
        </div>
        <div>
          <span class="big">k</span>
        </div>
        <div class="reveal-slot">
          <div class="okart">
            <div><span class="big">o</span></div>
            <div><span class="big">k</span></div>
            <div><span class="big">.</span></div>
            <div><span class="big">a</span></div>
            <div><span class="big">r</span></div>
            <div><span class="big">t</span></div>
          </div>
          <div class="small k">onkl<span class="letter-onkle-e">e</span></div>
        </div>
      </div>
    </header>
  </div>

  <p class="grid-title"></p>

  <div class="content-box"><p class="reveal-text">this space left intentionally blank</p></div>

  <script src="script.js"></script>
  <script>
    // fade-in on arrival, hamburger open/close, and the drawer itself (built from
    // arrays/menu-array.txt) are all handled by the shared script.js -- index.html never
    // needs to override the drawer's generic fade-out-then-navigate behavior, since every
    // link here leads to a different page.

    // always start at the top on reload, instead of the browser restoring scroll position
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }
    window.scrollTo(0, 0);
    window.addEventListener('load', () => window.scrollTo(0, 0));

    const infos = document.querySelectorAll('.info');

    function closeAll() {
      infos.forEach(el => el.classList.remove('open'));
    }

    infos.forEach(info => {
      info.querySelector('button').addEventListener('click', () => {
        const wasOpen = info.classList.contains('open');
        closeAll();
        if (!wasOpen) info.classList.add('open');
      });
    });

    document.addEventListener('pointerdown', e => {
      if (!e.target.closest('.info')) closeAll();
    });

    // italic glyphs (like this "e") often sit left of their own geometric box;
    // nudge shifts the vertical line to line up with the visible stroke
    const E_NUDGE_PX = -5;

    // images cycled through the grid box, fixed alphabetical order for now
    // (random/quasi-random selection is the planned next step)
    const GRID_IMAGES = [
      'images/images-small/(yellow-red, yellow-black)-small.webp',
      'images/images-small/35mm Slide Mt Rainier Ice Cave-small.webp',
      'images/images-small/Field Theory 1-small.webp',
      'images/images-small/Field Theory 2-small.webp',
      'images/images-small/Field Theory 3-small.webp',
      'images/images-small/Field Theory 4-small.webp',
      'images/images-small/Network of Bales (after Duchamp)-small.webp',
      'images/images-small/Network(s) of Bales + Outliers-small.webp',
      'images/images-small/SX-70 Eclipse-small.webp',
      'images/images-small/SX-70 Parka-small.webp',
      'images/images-small/SX-70 Umbrella-small.webp',
      'images/images-small/after-because-small.webp',
      'images/images-small/calculating area-small.webp',
      'images/images-small/fourfold-small.webp',
      'images/images-small/hope-small.webp',
      'images/images-small/how far-small.webp'
    ];
    let gridImageIndex = 0;
    let gridImageCycleStarted = false;

    // shown once, static, on a repeat visit within the same session (ID 16, "(yellow and red, yellow and black)")
    // instead of cycling through GRID_IMAGES -- title/size/year below come straight from
    // that piece's row in arrays/Art-Array.txt, typed in here since this is a fixed,
    // hand-picked override rather than a data-driven listing like art-display.html
    const RETURN_VISIT_IMAGE = 'images/images-small/(yellow-red, yellow-black)-small.webp';
    const RETURN_VISIT_TITLE = '(yellow and red, yellow and black)';
    const RETURN_VISIT_SIZE = '45" x 26"';
    const RETURN_VISIT_YEAR = '2026';
    // text in the box below the grid on a return visit (first visit keeps the page's own text)
    const RETURN_VISIT_BOX_TEXT = 'this space is no longer intentionally left blank';

    // preload and fully decode every cycled image well ahead of time (cycling doesn't
    // start for several seconds anyway) - Safari's WebP decode can lag behind the cut
    // otherwise; Chrome keeps up fine either way, so this only helps, never hurts
    GRID_IMAGES.forEach(src => {
      const img = new Image();
      img.src = src;
      if (img.decode) img.decode().catch(() => {});
    });

    // ===== grid dots (return visit only) =====
    // grid coordinates: 0,0 = lower-left crossing visible inside the frame --
    // bottom visible horizontal line x leftmost visible vertical line (one right of the "e" anchor).
    // x counts vertical lines to the right, y counts horizontal lines up.
    // Dots appear one at a time at random crossings. Once there are DOT_COUNT of them,
    // each new dot also removes the oldest one.
    const DOT_COUNT = 15;         // how many dots are on the grid at once
    const DOT_INTERVAL_MS = 750;  // time between each new dot (milliseconds; 1000 = 1 second)
    const DOT_FADE_MS = 200;      // how long each dot takes to fade up, and to fade out
    // each new dot picks one of these colors at random -- add more by adding to the list
    const DOT_COLORS = [
      '#ffffff',  // white
      '#83b2a0',  // menu green (style.css), 10% darker
      '#7d4d5f'   // name-text plum (index.css), 10% lighter
    ];
    const DOT_MAX_REPEAT = 1;     // a color can appear at most this many times in a row
    // dots come in two kinds -- filled, or just a circle outline -- in a fixed pattern (not random).
    // DOT_MOSTLY: which kind most of the dots are, 'filled' or 'outline'.
    // DOT_EVERY: every Nth dot is the OTHER kind. 0 = none (all DOT_MOSTLY), 1 = all the other
    //            kind, 2 = every other one (half), 3 = one in three, 4 = one in four, and so on.
    const DOT_MOSTLY = 'filled';
    const DOT_EVERY = 2;
    const DOT_OUTLINE_PX = 2;      // outline thickness, in pixels
    let dotCount = 0;              // how many dots have been added so far
    let recentDotColors = [];     // colors of the most recent dots, newest last

    // random color, but never the same color more than DOT_MAX_REPEAT times in a row
    function pickDotColor() {
      const recent = recentDotColors.slice(-DOT_MAX_REPEAT);
      const maxedOut = recent.length === DOT_MAX_REPEAT && recent.every(c => c === recent[0]) ? recent[0] : null;
      const choices = DOT_COLORS.filter(c => c !== maxedOut);
      const color = choices[Math.floor(Math.random() * choices.length)];
      recentDotColors.push(color);
      recentDotColors = recentDotColors.slice(-DOT_MAX_REPEAT);
      return color;
    }
    let GRID_X = [], GRID_Y = [], dotSize = 0; // filled in by positionGridBox()
    let dots = [];                // each dot on the grid: { gx, gy, el }, oldest first
    let dotsStarted = false;

    // sets a dot's size and position from its grid coordinates
    function placeDot(dot) {
      const el = dot.el;
      const onGrid = GRID_X[dot.gx] !== undefined && GRID_Y[dot.gy] !== undefined;
      el.style.display = onGrid ? '' : 'none'; // hidden if a resize left its column off the grid
      if (!onGrid) return;
      el.style.width = dotSize + 'px';
      el.style.height = dotSize + 'px';
      // lines are 1px wide, so a line's center is its position + 0.5
      el.style.left = (GRID_X[dot.gx] + 0.5 - dotSize / 2) + 'px';
      el.style.top = (GRID_Y[dot.gy] + 0.5 - dotSize / 2) + 'px';
    }

    // after a resize the grid lines are rebuilt: move every dot to its new spot,
    // and put the dots back on top of the new lines
    function drawDots() {
      const gridBox = document.querySelector('.grid-box');
      if (!gridBox) return;
      dots.forEach(dot => { placeDot(dot); gridBox.appendChild(dot.el); });
    }

    function addRandomDot() {
      const gridBox = document.querySelector('.grid-box');
      if (!gridBox) return;
      // pick a random crossing that doesn't already have a dot
      const free = [];
      GRID_X.forEach((_, gx) => GRID_Y.forEach((_, gy) => {
        if (!dots.some(d => d.gx === gx && d.gy === gy)) free.push([gx, gy]);
      }));
      if (!free.length) return;
      const [gx, gy] = free[Math.floor(Math.random() * free.length)];

      // new dot: starts invisible, then fades up
      const el = document.createElement('div');
      el.className = 'grid-dot';
      const color = pickDotColor();
      dotCount++;
      const isNth = DOT_EVERY > 0 && dotCount % DOT_EVERY === 0; // this one is the other kind
      const isOutline = DOT_MOSTLY === 'outline' ? !isNth : isNth;
      if (isOutline) {
        // outline: see-through middle, colored ring -- same overall size as a filled dot
        el.style.background = 'transparent';
        el.style.border = `${DOT_OUTLINE_PX}px solid ${color}`;
        el.style.boxSizing = 'border-box';
      } else {
        el.style.background = color;
      }
      el.style.transition = `opacity ${DOT_FADE_MS}ms ease`;
      const dot = { gx, gy, el };
      placeDot(dot);
      gridBox.appendChild(el);
      dots.push(dot);
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('shown')));

      // over the limit: fade out the oldest dot, then remove it
      if (dots.length > DOT_COUNT) {
        const oldest = dots.shift();
        oldest.el.classList.remove('shown');
        setTimeout(() => oldest.el.remove(), DOT_FADE_MS);
      }
    }

    function startDots() {
      if (dotsStarted) return;
      dotsStarted = true;
      addRandomDot();
      setInterval(addRandomDot, DOT_INTERVAL_MS);
    }

    function positionGridBox() {
      const a = document.querySelector('.letter-a');
      const onkleE = document.querySelector('.letter-onkle-e');
      const home = document.querySelector('.home');
      const gridBox = document.querySelector('.grid-box');
      const line1 = document.querySelector('.onkle-line');
      if (!a || !onkleE || !home || !gridBox || !line1) return;

      const homeRect = home.getBoundingClientRect();
      const gridBoxRect = gridBox.getBoundingClientRect();
      const aRect = a.getBoundingClientRect();
      const onkleERect = onkleE.getBoundingClientRect();

      // grid-box now spans the full height of .home (set in CSS: top:0, height:100%)

      // line 1: horizontal, through the middle of the "a" in "aurice"
      const aTop = Math.round(aRect.top + aRect.height / 2 - homeRect.top);
      line1.style.top = aTop + 'px';
      let latestLineDelay = 0;
      let firstVLineDelay = 0;

      // 5 more horizontal lines, through u / r / i / c / e of "aurice", staggered in slightly after line 1
      let uTop = aTop;
      let eTop = null;
      const hTops = [aTop]; // every horizontal line's top, top to bottom (for grid dots)
      document.querySelectorAll('.h-line').forEach((line, index) => {
        const letter = document.querySelector('.letter-' + line.dataset.letter);
        if (!letter) return;
        const top = Math.round(letter.getBoundingClientRect().top + letter.getBoundingClientRect().height / 2 - homeRect.top);
        line.style.top = top + 'px';
        const delay = 2.65 + index * 0.15;
        line.style.animationDelay = delay + 's';
        latestLineDelay = Math.max(latestLineDelay, delay);
        if (line.dataset.letter === 'u') uTop = top;
        if (line.dataset.letter === 'e') eTop = top;
        hTops.push(top);
      });

      // 5 more horizontal lines below "e" (no letters left to anchor to, so just continue the spacing)
      const spacing = Math.abs(uTop - aTop);
      gridBox.querySelectorAll('.h-line-extra').forEach(el => el.remove());
      let lastExtraTop = eTop;
      for (let i = 1; i <= 1; i++) {
        const top = eTop + spacing * i;
        const line = document.createElement('div');
        line.className = 'h-line-extra';
        line.style.top = top + 'px';
        const delay = 2.65 + (4 + i) * 0.15;
        line.style.animationDelay = delay + 's';
        latestLineDelay = Math.max(latestLineDelay, delay);
        gridBox.appendChild(line);
        lastExtraTop = top;
        hTops.push(top);
      }

      // the box/clip geometry below is still sized as if the (no-longer-drawn) 2nd extra
      // line existed, so the frame's final shape and the vertical lines' height come out
      // identical to before -- only that one line itself (which used to flash in and then
      // immediately get clipped away) is no longer actually drawn.
      const frameBottomAnchor = eTop + spacing * 2;

      // vertical lines: same spacing as the horizontal lines (distance from "a" line to "u" line),
      // anchored on the "e" of "onkle", repeated left and right to fill the box edge to edge
      const anchorX = Math.round(onkleERect.left + onkleERect.width / 2 - homeRect.left + E_NUDGE_PX);

      gridBox.querySelectorAll('.v-line').forEach(el => el.remove());

      const positions = [anchorX];
      if (spacing > 0) {
        for (let x = anchorX + spacing; x <= gridBoxRect.width; x += spacing) positions.push(x);
        // leftward fill (anchor toward the left edge) is disabled for now - not desired yet
        // for (let x = anchorX - spacing; x >= 0; x -= spacing) positions.push(x);
      }

      // on PC and phone portrait the page is exactly one viewable screen (no scroll),
      // so let the vertical lines run all the way to the bottom of that screen.
      // phone landscape still scrolls, so leave those lines stopping at the 11th line.
      const isPhoneLandscape = window.matchMedia("(orientation: landscape) and (max-height: 1050px) and (hover: none) and (pointer: coarse)").matches;
      const viewportBottom = Math.round(window.innerHeight - homeRect.top);
      const vLineHeight = isPhoneLandscape ? frameBottomAnchor : Math.max(frameBottomAnchor, viewportBottom);

      // grid-box itself needs to actually be this tall, or its own clip-path (and the
      // frame-box shrink that relies on it) can never reveal anything past .home's short natural height
      gridBox.style.height = vLineHeight + 'px';
      const gridBoxRectResized = gridBox.getBoundingClientRect();

      positions.forEach((x, index) => {
        const line = document.createElement('div');
        line.className = 'v-line';
        line.style.left = x + 'px';
        line.style.height = vLineHeight + 'px';
        const delay = 3 + index * 0.15;
        line.style.animationDelay = delay + 's';
        latestLineDelay = Math.max(latestLineDelay, delay);
        if (index === 0) firstVLineDelay = delay;
        gridBox.appendChild(line);
      });

      // grid coordinates for the dots (see "grid dots" below positionGridBox)
      GRID_X = positions.slice(1);        // vertical lines, left to right (trimmed to the frame below)
      GRID_Y = hTops.slice().reverse();   // horizontal lines, bottom to top
      dotSize = Math.round(spacing / 2);  // 1/2 of the distance between horizontal lines

      // timed to the SECOND-TO-LAST vertical line's finish (positions.length - 2), not the
      // very last one -- so the clip-path finishes shrinking just before the final line
      // completes its own draw, rather than exactly matching it.
      const lastVLineDelay = 3 + (positions.length - 2) * 0.15;
      const lastVLineFinishMs = (lastVLineDelay + 1) * 1000;

      // frame-box: shrinks from full page down to the rectangle formed by:
      // top-left  = a-line  x  (one vertical line right of the "e" anchor)
      // bottom-right = e-line  x  (the last vertical line that keeps the frame inside the blank box's right edge)
      // TEMPORARILY DISABLED so only the grid lines draw - flip FRAME_BOX_ENABLED back to true to restore
      const FRAME_BOX_ENABLED = true;
      // The frame's right edge lines up with the right edge of the "this space left
      // intentionally blank" box below (same distance from the screen edge, every screen).
      // It used to be measured from the menu icon, but the icon sits in the fixed bar at
      // the top, above the grid, so the grid can never run into it.
      const frameBox = document.querySelector('.frame-box');
      const contentBoxEl = document.querySelector('.content-box');
      if (FRAME_BOX_ENABLED && contentBoxEl && frameBox && eTop !== null) {
        // expand the box outward almost a full grid-square, stopping just inside the next line;
        // bottom edge stops just above the 11th horizontal line (the last of the 5 below "e")
        const FRAME_INSET_PX = 4;
        const grow = spacing - FRAME_INSET_PX;

        // rightmost vertical line whose frame edge (the line + grow) still stays inside the box's edge
        const boxRightX = contentBoxEl.getBoundingClientRect().right - homeRect.left;
        const fitting = positions.filter(x => x > anchorX && x + grow <= boxRightX);
        const rightX = fitting.length ? fitting[fitting.length - 1] : anchorX + spacing;
        // only the vertical lines visible inside the frame count as dot positions
        GRID_X = GRID_X.filter(x => x <= rightX);

        const finalTop = aTop - grow;
        const finalLeft = (anchorX + spacing) - grow;
        const finalBottom = frameBottomAnchor - FRAME_INSET_PX;
        const finalWidth = (rightX - (anchorX + spacing)) + grow * 2;
        const finalHeight = finalBottom - finalTop;

        const rightInset = gridBoxRectResized.width - (finalLeft + finalWidth);
        const bottomInset = gridBoxRectResized.height - (finalTop + finalHeight);
        const finalClip = `inset(${finalTop}px ${rightInset}px ${bottomInset}px ${finalLeft}px)`;

        // fade image: box sized/positioned to fit inside the frame with a margin;
        // object-fit: contain (in CSS) lets each image find its own fit within that
        // fixed box, whichever dimension binds depending on that image's own aspect ratio
        const IMG_MARGIN = 24;
        const fadeImage = document.querySelector('.grid-fade-image');
        if (fadeImage) {
          fadeImage.style.left = (finalLeft + IMG_MARGIN) + 'px';
          fadeImage.style.top = (finalTop + IMG_MARGIN) + 'px';
          fadeImage.style.width = (finalWidth - IMG_MARGIN * 2) + 'px';
          fadeImage.style.height = (finalHeight - IMG_MARGIN * 2) + 'px';
        }

        if (frameBox.dataset.animated === 'true') {
          frameBox.style.top = finalTop + 'px';
          frameBox.style.left = finalLeft + 'px';
          frameBox.style.width = finalWidth + 'px';
          frameBox.style.height = finalHeight + 'px';
          gridBox.style.clipPath = finalClip;
        } else if (!frameBox.dataset.pending) {
          frameBox.dataset.pending = 'true';
          frameBox.style.top = '0px';
          frameBox.style.left = '0px';
          frameBox.style.width = gridBoxRectResized.width + 'px';
          frameBox.style.height = gridBoxRectResized.height + 'px';
          // start once the first vertical line (the "onkle-e" anchor line) has hit the bottom
          // of the page - its own 1s draw plus its delay - rather than waiting for every line
          const shrinkStartMs = (firstVLineDelay + 1) * 1000;

          // rate of the shrink itself: instead of a fixed 1.75s, size it so the shrink
          // finishes exactly when the LAST vertical line finishes drawing -- more lines
          // (a wider screen) means a longer, slower shrink; fewer lines, a quicker one.
          // 200ms floor guards against a too-short/negative duration on a very narrow screen.
          const shrinkDurationS = Math.max(200, lastVLineFinishMs - shrinkStartMs) / 1000;

          requestAnimationFrame(() => {
            setTimeout(() => {
              frameBox.style.transition =
                `top ${shrinkDurationS}s ease, left ${shrinkDurationS}s ease, ` +
                `width ${shrinkDurationS}s ease, height ${shrinkDurationS}s ease`;
              gridBox.style.transition = `clip-path ${shrinkDurationS}s ease`;
              frameBox.style.top = finalTop + 'px';
              frameBox.style.left = finalLeft + 'px';
              frameBox.style.width = finalWidth + 'px';
              frameBox.style.height = finalHeight + 'px';
              gridBox.style.clipPath = finalClip;
              frameBox.dataset.animated = 'true';

              // reveal the content box and its text together once the frame-box finishes shrinking;
              // the fade image waits for the content box's own fade to finish (see below)
              const contentBox = document.querySelector('.content-box');
              const revealText = document.querySelector('.reveal-text');
              frameBox.addEventListener('transitionend', function onDone(evt) {
                if (evt.propertyName !== 'width') return;
                frameBox.removeEventListener('transitionend', onDone);
                if (contentBox) contentBox.classList.add('revealed');
                if (revealText) revealText.classList.add('revealed');
              });
            }, shrinkStartMs);
          });
        }
      }
    }

    // the fade image waits until the box's own reveal animation finishes, then
    // starts cycling through GRID_IMAGES - 667ms per image, hard cut, no transition
    document.querySelector('.content-box').addEventListener('animationend', evt => {
      if (evt.animationName !== 'fadeIn') return;
      const fadeImage = document.querySelector('.grid-fade-image');
      if (!fadeImage) return;
      fadeImage.classList.add('revealed');
      if (!gridImageCycleStarted && GRID_IMAGES.length) {
        gridImageCycleStarted = true;
        fadeImage.src = GRID_IMAGES[gridImageIndex];
        setInterval(() => {
          gridImageIndex = (gridImageIndex + 1) % GRID_IMAGES.length;
          fadeImage.src = GRID_IMAGES[gridImageIndex];
        }, 667);
      }
    });

    // places .grid-title just below the bottom of the grid (the frame-box), and lines it
    // up under the grid image (which is positioned by JS, not simple centering) by copying
    // the image's own left/width. Phones held upright: the image is too narrow for the
    // title, so the title gets a wider space instead, centered under the grid -- as wide
    // as it can be without going past the right edge of the "this space left
    // intentionally blank" box, or closer than GRID_TITLE_PHONE_MARGIN to the left edge.
    const GRID_TITLE_GAP = 22;          // space between the bottom of the grid and the title
    const GRID_TITLE_PHONE_MARGIN = 20; // phone upright: smallest space left of the title
    function syncGridTitlePosition() {
      const gridTitle = document.querySelector('.grid-title');
      const fadeImage = document.querySelector('.grid-fade-image');
      const frameBox = document.querySelector('.frame-box');
      if (!gridTitle || !fadeImage || !frameBox) return;

      // vertical: the title normally sits right below the name block (.home), which on some
      // screens ends well below the grid -- so move it up (or down) by the difference
      gridTitle.style.marginTop = '0px';
      const titleTop = gridTitle.getBoundingClientRect().top;
      const gridBottom = frameBox.getBoundingClientRect().bottom;
      gridTitle.style.marginTop = (gridBottom + GRID_TITLE_GAP - titleTop) + 'px';

      // horizontal
      const isPhoneUpright = window.matchMedia('(orientation: portrait) and (max-width: 700px)').matches;
      if (isPhoneUpright) {
        const contentBox = document.querySelector('.content-box');
        const rightEdge = contentBox.getBoundingClientRect().right; // right side of the blank box
        const frameRect = frameBox.getBoundingClientRect();
        const gridCenter = (frameRect.left + frameRect.right) / 2;
        // half the title's width: whichever side runs out of room first decides
        const half = Math.min(gridCenter - GRID_TITLE_PHONE_MARGIN, rightEdge - gridCenter);
        gridTitle.style.marginLeft = (gridCenter - half) + 'px';
        gridTitle.style.width = (half * 2) + 'px';
      } else {
        const imgRect = fadeImage.getBoundingClientRect();
        gridTitle.style.marginLeft = imgRect.left + 'px';
        gridTitle.style.width = imgRect.width + 'px';
      }
    }

    // ===== skip the intro animation on a repeat visit within the same browser session =====
    const skipIntro = document.documentElement.classList.contains('skip-intro');
    if (skipIntro) {
      // pre-mark the frame-box as already animated so positionGridBox() takes its
      // "already done" branch (apply final geometry immediately, no delay/transition)
      const frameBoxEl = document.querySelector('.frame-box');
      if (frameBoxEl) frameBoxEl.dataset.animated = 'true';
    } else {
      sessionStorage.setItem('introPlayed', '1');
    }

    positionGridBox();
    window.addEventListener('load', positionGridBox);
    window.addEventListener('resize', positionGridBox);
    window.addEventListener('orientationchange', positionGridBox);
    if (skipIntro) {
      // redraw dots after anything that rebuilds the grid lines
      window.addEventListener('load', drawDots);
      window.addEventListener('resize', drawDots);
      window.addEventListener('orientationchange', drawDots);
      startDots();
    }

    if (skipIntro) {
      // the reveal chain below normally fires off the frame-box's transitionend, which
      // never happens when there's no transition to begin with - do it directly instead
      const contentBox = document.querySelector('.content-box');
      const revealText = document.querySelector('.reveal-text');
      const fadeImage = document.querySelector('.grid-fade-image');
      if (contentBox) contentBox.classList.add('revealed');
      if (revealText) {
        revealText.textContent = RETURN_VISIT_BOX_TEXT;
        revealText.classList.add('revealed');
      }
      if (fadeImage) {
        fadeImage.classList.add('revealed');
        gridImageCycleStarted = true; // also blocks the normal animationend listener from ever starting a cycle here
        fadeImage.src = RETURN_VISIT_IMAGE;
      }
      const gridTitle = document.querySelector('.grid-title');
      if (gridTitle) {
        const gap = ' '.repeat(4);
        gridTitle.innerHTML = '<span class="piece-name">' + RETURN_VISIT_TITLE + '</span><br>' + RETURN_VISIT_YEAR + gap + RETURN_VISIT_SIZE;
        gridTitle.style.display = 'block';
        syncGridTitlePosition();
        // again once the page has finished loading -- the grid gets re-measured then too
        window.addEventListener('load', syncGridTitlePosition);
        window.addEventListener('resize', syncGridTitlePosition);
        window.addEventListener('orientationchange', syncGridTitlePosition);
      }
    }
  </script>

</body>
</html>
