<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Art</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <button id="menu-toggle" type="button" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>

  <nav id="drawer">
    <a href="art-display.html">art</a>
    <a href="about.html#bio">bio</a>
    <a href="about.html#statement">statement(s)</a>
    <a href="about.html#contact">contact</a>
  </nav>

  <div class="home">
    <div class="onkle-line"></div>

    <header id="intro">
      <div id="text">
        <div>
          <span class="big">m</span>
          <div class="small">a<br>u<br>r<br>i<br>c<br>e</div>
        </div>
        <div>
          <span class="big">k</span>
        </div>
        <div class="reveal-slot">
          <div class="okart">
            <div><span class="big">o</span></div>
            <div><span class="big">k</span></div>
            <div><span class="big">.</span></div>
            <div><span class="big">a</span></div>
            <div><span class="big">r</span></div>
            <div><span class="big">t</span></div>
          </div>
          <div class="small k">onkle</div>
        </div>
      </div>
    </header>

    <div class="gallery">
       <div class="box">
        <img src="images/Network of Bales (after Duchamp).webp" alt="">
      </div>
    </div>
  </div>

  <script>
    const infos = document.querySelectorAll('.info');

    function closeAll() {
      infos.forEach(el => el.classList.remove('open'));
    }

    infos.forEach(info => {
      info.querySelector('button').addEventListener('click', () => {
        const wasOpen = info.classList.contains('open');
        closeAll();
        if (!wasOpen) info.classList.add('open');
      });
    });

    document.addEventListener('pointerdown', e => {
      if (!e.target.closest('.info')) closeAll();
    });

    const toggle = document.getElementById('menu-toggle');
    const drawer = document.getElementById('drawer');

    toggle.addEventListener('click', () => {
      document.body.classList.toggle('menu-open');
    });

    document.addEventListener('pointerdown', e => {
      if (!e.target.closest('#drawer') && !e.target.closest('#menu-toggle')) {
        document.body.classList.remove('menu-open');
      }
    });

    drawer.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        document.body.classList.remove('menu-open');
      });
    });

    function positionOnkleLine() {
      const onkle = document.querySelector('.small.k');
      const home = document.querySelector('.home');
      const line = document.querySelector('.onkle-line');
      if (!onkle || !home || !line) return;
      const onkleRect = onkle.getBoundingClientRect();
      const homeRect = home.getBoundingClientRect();
      line.style.top = (onkleRect.top + onkleRect.height / 2 - homeRect.top) + 'px';
    }

    positionOnkleLine();
    window.addEventListener('load', positionOnkleLine);
    window.addEventListener('resize', positionOnkleLine);
    window.addEventListener('orientationchange', positionOnkleLine);
  </script>

</body>
</html>
