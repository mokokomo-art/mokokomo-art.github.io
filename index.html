<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Art</title>
  <style>
    body {
      margin: 0;
      background-color: #e8e4dc;
    }

    .gallery {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      padding: 40px 20px;
    }

    .box {
      background-color: #ffffff;
      padding: 20px;
      width: 100%;
      max-width: 900px;
      box-sizing: border-box;
       border-radius: 16px;
    }

    .box img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

  <div class="gallery">
    <div class="box">
      <img src="images/art1.jpg" alt="">
    </div>
    <div class="box">
      <img src="images/art2.jpg" alt="">
    </div>
    <div class="box">
      <img src="images/art3.jpg" alt="">
    </div>
  </div>

</body>
</html>
