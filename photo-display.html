<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Art</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="photo-display.css">
</head>
<body>

  <div id="menu-bar"></div>

  <button id="menu-toggle" type="button" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>

  <nav id="drawer"></nav>

  <div class="gallery" id="gallery"></div>

  <script src="script.js"></script>
  <script>
    // ===== data loading =====
    // arrays/photo-array.txt is the live source data, same tab-delimited format as
    // Art-Array.txt (Mac-Roman encoded, CSV-style quoting for fields with a literal ").
    // No per-photo category/faq/price system yet -- this page just lists every photo in
    // category-Order. It does show one fixed intro block though, reusing
    // category-array.txt/category-intro-array.txt's category ID 3 ("photo as end") --
    // same two files art-display.html reads, just always this one ID here since this
    // page isn't filtered by category.

    function parseDelimited(text) {
      const rows = [];
      let row = [], field = '', inQuotes = false;
      text = text.replace(/\r\n/g, '\n');
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
          if (c === '"') {
            if (text[i + 1] === '"') { field += '"'; i++; }
            else { inQuotes = false; }
          } else {
            field += c;
          }
        } else {
          if (c === '"') { inQuotes = true; }
          else if (c === '\t') { row.push(field); field = ''; }
          else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
          else { field += c; }
        }
      }
      if (field.length || row.length) { row.push(field); rows.push(row); }
      return rows.filter(r => !(r.length === 1 && r[0] === ''));
    }

    function rowsToObjects(rows) {
      const header = rows[0];
      return rows.slice(1).map(r => {
        const obj = {};
        header.forEach((h, i) => obj[h] = (r[i] ?? '').trim());
        return obj;
      });
    }

    function buildPhotoInfo(rows) {
      return rowsToObjects(rows).map(r => ({
        id: Number(r['ID-num']),
        piece: r['Piece'],
        file: r['File Name'],
        order: Number(r['category Order']),
        date: r['date-opus'],
        size: r['size'],
        info: r['info']
      }));
    }

    // category-array.txt: ID<TAB>Name per row, header first.
    function parseCategoryNames(text) {
      const names = {};
      text.trim().split(/\r?\n/).slice(1).forEach(line => {
        const [id, name] = line.split('\t');
        names[Number(id)] = name;
      });
      return names;
    }

    // category-intro-array.txt: [ID] on its own line, then the intro text.
    function parseIntroText(text) {
      const intros = {};
      const re = /\[(\d+)\]\r?\n([\s\S]*?)(?=\r?\n\[\d+\]\r?\n|$)/g;
      let m;
      while ((m = re.exec(text)) !== null) intros[Number(m[1])] = m[2].trim();
      return intros;
    }

    // this page always shows one fixed intro -- category 3, "photo as end" --
    // it isn't filtered by category the way art-display.html's union views are.
    const PHOTO_CATEGORY_ID = 3;

    let PHOTO_INFO = [];
    let CATEGORY_NAMES = {};
    let INTROS = {};

    const dataReady = Promise.all([
      fetch('arrays/photo-array.txt')
        .then(r => r.arrayBuffer())
        .then(buf => new TextDecoder('macintosh').decode(buf))
        .then(parseDelimited)
        .then(buildPhotoInfo),
      window.menuReady, // parsed + drawer already built by the shared script.js
      fetch('arrays/category-array.txt').then(r => r.text()).then(parseCategoryNames),
      fetch('arrays/category-intro-array.txt').then(r => r.text()).then(parseIntroText)
    ]).then(([photoInfo, menu, categoryNames, intros]) => {
      PHOTO_INFO = photoInfo;
      CATEGORY_NAMES = categoryNames;
      INTROS = intros;
    }).catch(err => console.error('failed to load photo data', err));

    // ===== gallery rendering =====
    const gallery = document.getElementById('gallery');

    function renderGallery() {
      gallery.innerHTML = '';
      window.scrollTo(0, 0);

      if (INTROS[PHOTO_CATEGORY_ID]) {
        const intro = document.createElement('div');
        intro.className = 'category-intro';

        const heading = document.createElement('p');
        heading.className = 'category-intro-heading';
        heading.textContent = CATEGORY_NAMES[PHOTO_CATEGORY_ID] || '';
        intro.appendChild(heading);

        const body = document.createElement('p');
        body.className = 'category-intro-body';
        body.innerHTML = INTROS[PHOTO_CATEGORY_ID].replace(/\n/g, '<br>');
        intro.appendChild(body);

        gallery.appendChild(intro);
      }

      const pieces = PHOTO_INFO.slice().sort((a, b) => a.order - b.order);

      pieces.forEach(photo => {
        const box = document.createElement('div');
        box.className = 'box';

        const img = document.createElement('img');
        img.src = 'images/photo images/' + photo.file;
        img.alt = '';
        box.appendChild(img);

        gallery.appendChild(box);
      });
    }

    dataReady.then(renderGallery);

  </script>

</body>
</html>
