<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Art</title>
  <link rel="stylesheet" href="art-display.css">
</head>
<body>

  <div id="menu-bar">mk</div>

  <button id="menu-toggle" type="button" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>

  <nav id="drawer"></nav>

  <div class="gallery" id="gallery"></div>

  <script>
    // ===== data loading =====
    // arrays/Art-Array.txt, arrays/faq-array.txt, arrays/menu-array.txt are the live
    // source data - editing those files (Excel export for Art-Array.txt) is enough to
    // update the site, nothing here needs hand-transcribing. arrays/category-array.txt
    // is not fetched here -- it's a reference file only, for keeping track of which
    // Category number in Art-Array.txt means what.

    // Art-Array.txt is exported from Excel (Mac) as tab-delimited text, which comes out
    // Mac-Roman encoded with CSV-style quoting (fields containing a literal " are wrapped
    // in "..." with "" for an embedded quote) - this parser handles both.
    function parseDelimited(text) {
      const rows = [];
      let row = [], field = '', inQuotes = false;
      text = text.replace(/\r\n/g, '\n');
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
          if (c === '"') {
            if (text[i + 1] === '"') { field += '"'; i++; }
            else { inQuotes = false; }
          } else {
            field += c;
          }
        } else {
          if (c === '"') { inQuotes = true; }
          else if (c === '\t') { row.push(field); field = ''; }
          else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
          else { field += c; }
        }
      }
      if (field.length || row.length) { row.push(field); rows.push(row); }
      return rows.filter(r => !(r.length === 1 && r[0] === ''));
    }

    function rowsToObjects(rows) {
      const header = rows[0];
      return rows.slice(1).map(r => {
        const obj = {};
        header.forEach((h, i) => obj[h] = (r[i] ?? '').trim());
        return obj;
      });
    }

    function buildArtInfo(rows) {
      return rowsToObjects(rows).map(r => ({
        id: Number(r['ID-num']),
        piece: r['Piece'],
        file: r['File Name'],
        category: Number(r['Category']),
        order: Number(r['category Order']),
        date: r['date-opus'],
        size: r['size'],
        info: r['info'],
        price: r['Price']
      }));
    }

    // menu-array.txt is plain UTF-8, no quoting needed. Each row is Name / Action / Value:
    //   goto  -> Value is a page to link straight to (home, about, nothing, coming-soon)
    //   union -> Value is a comma-separated list of category IDs (from
    //            arrays/category-array.txt) to filter to, OR'd together -- a single ID
    //            is just a union of one
    //   chron -> the fixed chronological view (categories 1+2, newest first); no Value yet
    function parseMenu(text) {
      return text.trim().split(/\r?\n/).slice(1).map(line => {
        const [name, action, value, intro] = line.split('\t');
        return { name, action, value: value || '', intro: intro || '' };
      });
    }

    // faq-array.txt: one [ID] block per piece, kept out of Art-Array.txt because Excel's
    // tab-delimited export choked on a field with embedded quotes.
    function parseFaqText(text) {
      const faqs = {};
      const re = /\[(\d+)\]\r?\n([\s\S]*?)(?=\r?\n\[\d+\]\r?\n|$)/g;
      let m;
      while ((m = re.exec(text)) !== null) faqs[Number(m[1])] = m[2].trim();
      return faqs;
    }

    // category-array.txt: ID<TAB>Name per row, header first. Was reference-only until now --
    // this is the first code that actually reads it, to build the category intro heading.
    function parseCategoryNames(text) {
      const names = {};
      text.trim().split(/\r?\n/).slice(1).forEach(line => {
        const [id, name] = line.split('\t');
        names[Number(id)] = name;
      });
      return names;
    }

    // category-intro-array.txt: same [ID]-block format as faq-array.txt, one intro per category.
    function parseIntroText(text) {
      const intros = {};
      const re = /\[(\d+)\]\r?\n([\s\S]*?)(?=\r?\n\[\d+\]\r?\n|$)/g;
      let m;
      while ((m = re.exec(text)) !== null) intros[Number(m[1])] = m[2].trim();
      return intros;
    }

    let ART_INFO = [];
    let MENU = [];
    let FAQS = {};
    let CATEGORY_NAMES = {}; // arrays/category-array.txt, ID -> Name (for the intro heading)
    let INTROS = {};        // arrays/category-intro-array.txt, ID -> intro text

    const dataReady = Promise.all([
      fetch('arrays/Art-Array.txt')
        .then(r => r.arrayBuffer())
        .then(buf => new TextDecoder('macintosh').decode(buf))
        .then(parseDelimited)
        .then(buildArtInfo),
      fetch('arrays/menu-array.txt').then(r => r.text()).then(parseMenu),
      fetch('arrays/faq-array.txt').then(r => r.text()).then(parseFaqText),
      fetch('arrays/category-array.txt').then(r => r.text()).then(parseCategoryNames),
      fetch('arrays/category-intro-array.txt').then(r => r.text()).then(parseIntroText)
    ]).then(([artInfo, menu, faqs, categoryNames, intros]) => {
      ART_INFO = artInfo;
      MENU = menu;
      FAQS = faqs;
      CATEGORY_NAMES = categoryNames;
      INTROS = intros;
    }).catch(err => console.error('failed to load art data', err));

    // ===== gallery rendering =====
    const gallery = document.getElementById('gallery');

    // finds the MENU row that produced this categoryId, so its Intro column can be read.
    function findMenuEntryFor(categoryId) {
      return MENU.find(m => {
        if (categoryId === 'chron') return m.action === 'chron';
        if (m.action !== 'union') return false;
        const ids = parseCategoryParam(m.value);
        return Array.isArray(ids) && ids.length === categoryId.length && ids.every(id => categoryId.includes(id));
      });
    }

    function renderCategory(categoryId) {
      gallery.innerHTML = '';
      window.scrollTo(0, 0);

      let pieces;
      if (categoryId === 'chron') {
        // "everything (but odds and ends)": categories 1+2 combined, newest piece first
        pieces = ART_INFO
          .filter(a => a.category === 1 || a.category === 2)
          .sort((a, b) => b.date.localeCompare(a.date));
      } else {
        // categoryId is a list of one or more category IDs, OR'd together -- a single
        // real category (like "image as means") is just a union of one
        pieces = ART_INFO
          .filter(a => categoryId.includes(a.category))
          .sort((a, b) => a.order - b.order);
      }

      // category intro: menu-array.txt's Intro column links this listing (by matching its
      // Action/Value back to the MENU row) to an ID in arrays/category-intro-array.txt.
      const menuEntry = findMenuEntryFor(categoryId);
      const introId = menuEntry && menuEntry.intro ? Number(menuEntry.intro) : null;
      if (introId && INTROS[introId]) {
        const intro = document.createElement('div');
        intro.className = 'category-intro';

        const heading = document.createElement('p');
        heading.className = 'category-intro-heading';
        heading.textContent = (Array.isArray(categoryId) && categoryId.length === 1)
          ? (CATEGORY_NAMES[categoryId[0]] || '')
          : '';
        intro.appendChild(heading);

        const body = document.createElement('p');
        body.className = 'category-intro-body';
        body.innerHTML = INTROS[introId].replace(/\n/g, '<br>');
        intro.appendChild(body);

        gallery.appendChild(intro);
      }

      pieces.forEach(art => {
        const box = document.createElement('div');
        box.className = 'box';

        const img = document.createElement('img');
        img.src = 'images/' + art.file;
        img.alt = '';
        box.appendChild(img);

        const caption = document.createElement('div');
        caption.className = 'caption';

        const title = document.createElement('p');
        title.className = 'title';
        title.textContent = art.piece;
        caption.appendChild(title);

        const captionRight = document.createElement('div');
        captionRight.className = 'caption-right';

        const sizeEl = document.createElement('p');
        sizeEl.className = 'size';
        sizeEl.textContent = art.size;
        captionRight.appendChild(sizeEl);

        const meta = document.createElement('div');
        meta.className = 'meta';

        const infoWrap = document.createElement('div');
        infoWrap.className = 'info';
        const infoBtn = document.createElement('button');
        infoBtn.type = 'button';
        infoBtn.textContent = 'i';
        const infoP = document.createElement('p');
        const year = art.date.slice(0, 4);
        infoP.textContent = `© ${year}, ${art.info}`;
        infoBtn.addEventListener('click', () => toggleInfo(infoWrap));
        infoWrap.append(infoBtn, infoP);
        meta.appendChild(infoWrap);

        const faqWrap = document.createElement('div');
        faqWrap.className = 'info faq';
        const faqBtn = document.createElement('button');
        faqBtn.type = 'button';
        faqBtn.textContent = '?';
        const faqP = document.createElement('p');
        faqP.innerHTML = FAQS[art.id] || '';
        faqBtn.addEventListener('click', () => toggleInfo(faqWrap));
        faqWrap.append(faqBtn, faqP);
        meta.appendChild(faqWrap);

        const priceWrap = document.createElement('div');
        priceWrap.className = 'info price';
        const priceBtn = document.createElement('button');
        priceBtn.type = 'button';
        priceBtn.textContent = '$';
        const priceP = document.createElement('p');
        priceP.textContent = art.price;
        priceBtn.addEventListener('click', () => toggleInfo(priceWrap));
        priceWrap.append(priceBtn, priceP);
        meta.appendChild(priceWrap);

        captionRight.appendChild(meta);
        caption.appendChild(captionRight);
        box.appendChild(caption);
        gallery.appendChild(box);
      });
    }

    // fade the whole page in on arrival (pairs with index.html fading itself out
    // before navigating here). Double rAF makes sure the browser has painted the
    // initial opacity:0 state before the transition to 1 starts.
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        document.body.style.opacity = '1';
      });
    });

    // fast cross-dissolve between categories: fade the gallery out, swap its content
    // while invisible, fade back in. Only used for an actual category-to-category switch
    // (drawer click / back-forward) -- the very first render on page load skips it.
    const GALLERY_FADE_MS = 200;
    function goToCategory(categoryId, pushUrl) {
      gallery.style.opacity = '0';
      setTimeout(() => {
        renderCategory(categoryId);
        if (pushUrl) history.pushState({ category: categoryId }, '', `art-display.html?category=${categoryId}`);
        gallery.style.opacity = '1';
      }, GALLERY_FADE_MS);
    }

    function toggleInfo(wrap) {
      const wasOpen = wrap.classList.contains('open');
      document.querySelectorAll('.info.open').forEach(el => el.classList.remove('open'));
      if (!wasOpen) wrap.classList.add('open');
    }

    document.addEventListener('pointerdown', e => {
      if (!e.target.closest('.info')) {
        document.querySelectorAll('.info.open').forEach(el => el.classList.remove('open'));
      }
    });

    // "chron" stays a plain string; anything else is parsed into a list of category
    // IDs, even a single one -- see renderCategory()
    function parseCategoryParam(raw) {
      return raw === 'chron' ? 'chron' : raw.split(',').map(n => Number(n.trim()));
    }

    function getCategoryFromURL() {
      const s = new URLSearchParams(window.location.search).get('category');
      return s ? parseCategoryParam(s) : null;
    }

    // ===== drawer: built entirely from arrays/menu-array.txt, once data is loaded =====
    dataReady.then(() => {
      const drawer = document.getElementById('drawer');

      MENU.forEach(({ name, action, value }) => {
        const a = document.createElement('a');
        a.innerHTML = name; // menu-array.txt names can include plain HTML, e.g. <br>

        if (action === 'union' || action === 'chron') {
          const categoryValue = action === 'chron' ? 'chron' : parseCategoryParam(value);
          a.href = `art-display.html?category=${action === 'chron' ? 'chron' : value}`;
          a.addEventListener('click', e => {
            e.preventDefault();
            goToCategory(categoryValue, true);
          });
        } else if (action === 'goto' && value === 'index.html') {
          // "home" specifically fades the page out first, pairing with index.html's
          // own fade-in on arrival -- other goto destinations just navigate plainly
          a.href = value;
          a.addEventListener('click', e => {
            e.preventDefault();
            document.body.style.transition = 'opacity 0.5s ease';
            document.body.style.opacity = '0';
            setTimeout(() => { window.location.href = value; }, 500);
          });
        } else { // goto -- plain navigation, no fade (not asked for yet on these pages)
          a.href = value;
        }

        a.addEventListener('click', () => document.body.classList.remove('menu-open'));
        drawer.appendChild(a);
      });

      const startCategory = getCategoryFromURL();
      if (startCategory) renderCategory(startCategory);
    });

    window.addEventListener('popstate', () => {
      const s = getCategoryFromURL();
      if (s) goToCategory(s, false);
    });

    // menu - same behavior as index.html, no intro animation to wait for on this page
    const toggle = document.getElementById('menu-toggle');
    const drawer = document.getElementById('drawer');

    toggle.addEventListener('click', () => {
      document.body.classList.toggle('menu-open');
    });

    document.addEventListener('pointerdown', e => {
      if (!e.target.closest('#drawer') && !e.target.closest('#menu-toggle')) {
        document.body.classList.remove('menu-open');
      }
    });
  </script>

</body>
</html>
