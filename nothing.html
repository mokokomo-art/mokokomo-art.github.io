<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Art</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="placeholder.css">
  <link rel="stylesheet" href="nothing.css">
</head>
<body class="nothing-page">

  <div id="menu-bar"></div>

  <button id="menu-toggle" type="button" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>

  <nav id="drawer"></nav>

  <div class="up-arrow" aria-hidden="true">&#8593;</div>
  <div class="left-arrow" aria-hidden="true">&#8592;</div>
  <div class="right-arrow" aria-hidden="true">&#8594;</div>

  <div class="content-box"><div class="text-stack" id="text-stack"><p class="reveal-text word-swap" id="words"></p></div><div class="down-arrow" aria-hidden="true">&#8595;</div></div>

  <!-- the closing shapes (see nothing.css). Only the one(s) SETTINGS.shape calls for are used. -->
  <div class="invert-wipe" id="wipe-box" aria-hidden="true"></div>
  <div class="invert-wipe" id="wipe-circle" aria-hidden="true"></div>
  <div class="invert-wipe" id="wipe-disc" aria-hidden="true"></div>

  <script src="script.js"></script>
  <script>
    // =====================================================================
    // SETTINGS -- change these to adjust the page. Times are in seconds.
    // =====================================================================
    const SETTINGS = {
      // 'box', 'circle', 'alternate' (box pass, then circle pass, then box...), or
      // 'box-in-circle-out' (every pass closes in as a box and opens out as a circle), or
      // 'box-in-disc-out' (every pass closes in as a box of one color, then a disc of its
      // complementary color grows out from the center to cover it)
      shape: 'box-in-circle-out',

      inTime: 3.5,             // time for the edge to close in to the center
      centerPause: 0.25,     // time it holds at the center
      outTime: 3,            // time to go back out to the edges
      edgePause: 0.25,       // time it holds at the edges before the next pass
      startDelay: 0.5,       // time after the page opens before the first pass

      boxSoftEdge: 6,        // width of the box's soft edge, as % of the screen's longer side
      circleSoftEdge: 10,    // width of the circle's soft edge, as % of the distance to a corner

      pageColor: '#fff',     // page background
      // the closing shape's color, one per pass, then back to the first.
      // The words and arrows switch to the same color as each new pass begins
      // (while the shape is out at the edges).
      // (Not used when useColorWheel is true.)
      colors: ['#6e394d', '#b4b9c2'],   // maroon, blue-gray

      // the screen color wheel: when useColorWheel is true, the colors come from the four
      // settings below instead of the colors list above. Each color gets one pass, then its
      // complement (straight across the wheel, 180 degrees away) gets the next, each opening
      // back out to the white page. Then it moves hueStep degrees clockwise for the next pair;
      // 360 / hueStep pairs bring it back to the start (30 gives 12 pairs, 45 gives 8).
      // ('box-in-disc-out' uses each pair in one pass: the box is the color, the disc its complement.)
      useColorWheel: true,
      startHue: 160,         // first box's hue, in degrees around the wheel
      hueStep: 60,           // degrees to move between passes
      lapShift: 15,          // each time it gets all the way around (360 degrees), the next lap
                             // starts this many degrees further clockwise (0 = every lap the same)
      saturation: 30,        // % -- how far out from the center of the wheel
      brightness: 56,        // % -- the biggest of the three rgb numbers (how light)
      textSize: 24,          // size of the words, in pixels

      // the phrases themselves live in arrays/nothing-array.txt -- one phrase per line,
      // under a "Phrase" header line. Phrases can include HTML tags like <em>...</em>.
      // One phrase per inward pass, in the order they're listed, then back to the first.
      // The page opens on the first one.
      wordFade: 1.2,         // time for one word to dissolve into the next
      wordFadeEnd: 0.3       // when the new words finish fading in, in seconds after the box
                             // fully closes (so it follows inTime). 0 = right as it closes;
                             // a minus number = before it closes.
    };
    // =====================================================================

    const S = SETTINGS;

    // build the color wheel pairs (see useColorWheel above):
    // color, its complement, the next color, its complement, ...
    const boxColors = [], discColors = [];
    if (S.useColorWheel) {
      const pairs = Math.round(360 / S.hueStep);
      // how many laps before the starting point comes back to startHue
      // (e.g. 10 degrees a lap takes 36 laps); then the whole thing repeats
      const gcd = (a, b) => b ? gcd(b, a % b) : a;
      const laps = 360 / gcd(360, Math.abs(Math.round(S.lapShift)) % 360 || 360);
      for (let lap = 0; lap < laps; lap++) {
        for (let i = 0; i < pairs; i++) {
          const hue = S.startHue + lap * S.lapShift + i * S.hueStep;
          boxColors.push(wheelColor(hue, S.saturation, S.brightness));
          discColors.push(wheelColor(hue + 180, S.saturation, S.brightness));
        }
      }
      S.colors = boxColors.flatMap((c, i) => [c, discColors[i]]);
    }
    const root = document.documentElement.style;
    root.setProperty('--page-color', S.pageColor);
    root.setProperty('--wipe-color', S.colors[0]);
    root.setProperty('--text-color', S.colors[0]);
    root.setProperty('--text-size', S.textSize + 'px');
    root.setProperty('--box-soft', S.boxSoftEdge + 'vmax');
    root.setProperty('--circle-soft', S.circleSoftEdge + '%');

    // one pass = in, hold, out, hold
    const cycle = S.inTime + S.centerPause + S.outTime + S.edgePause;

    // a time (seconds) as a percentage of a loop's length -- the math that used to be done by hand
    const pct = (t, total) => (t / total * 100).toFixed(6) + '%';   // 6 decimals keeps a 0.001s step apart even in a long loop

    // keyframes for one pass of a shape, starting passStart seconds into a loop of total seconds
    function shapeKeyframes(name, prop, off, center, total, passStart) {
      const t1 = passStart, t2 = t1 + S.inTime, t3 = t2 + S.centerPause, t4 = t3 + S.outTime;
      return `@keyframes ${name} {
        0%, ${pct(t1, total)} { ${prop}: ${off}; }
        ${pct(t2, total)}, ${pct(t3, total)} { ${prop}: ${center}; }
        ${pct(t4, total)}, 100% { ${prop}: ${off}; }
      }`;
    }

    const boxEl = document.getElementById('wipe-box');
    const circleEl = document.getElementById('wipe-circle');
    let css = '';

    // box: each side goes from just off-screen to halfway across (they meet in the middle)
    // circle: the hole goes from the corners to past the center (so the soft edge fully clears it)
    const boxOff = -S.boxSoftEdge + 'vmax', circleCenter = -S.circleSoftEdge + '%';
    const shapeTotal = S.shape === 'alternate' ? 2 * cycle : cycle;

    const discEl = document.getElementById('wipe-disc');
    if (S.shape !== 'box-in-disc-out') discEl.style.display = 'none';

    // when the disc has filled the screen (halfway through the pause at the edges)
    const discFull = S.inTime + S.centerPause + S.outTime + S.edgePause / 2;

    if (S.shape === 'box-in-disc-out') {
      // box closes in and stays closed while the disc grows out over it. Once the disc
      // covers the screen, both reset (unseen) and the page underneath takes the disc's
      // color, so the next box closes in over it.
      const t2 = S.inTime, t3 = t2 + S.centerPause, t4 = t3 + S.outTime;
      const blink = 0.001; // seconds -- makes each reset instant instead of a blend
      css += `@keyframes boxInHold {
        0% { --side: ${boxOff}; }
        ${pct(t2, cycle)}, ${pct(discFull, cycle)} { --side: 50%; }
        ${pct(discFull + blink, cycle)}, 100% { --side: ${boxOff}; }
      }
      @keyframes discOut {
        0%, ${pct(t3, cycle)} { --hole: ${circleCenter}; }
        ${pct(t4, cycle)}, ${pct(discFull, cycle)} { --hole: 100%; }
        ${pct(discFull + blink, cycle)}, 100% { --hole: ${circleCenter}; }
      }`;
      boxEl.style.animation = `boxInHold ${cycle}s linear ${S.startDelay}s infinite backwards`;
      discEl.style.animation = `discOut ${cycle}s linear ${S.startDelay}s infinite backwards`;
    } else if (S.shape === 'box-in-circle-out') {
      // box closes in; halfway through the pause at the center (screen fully covered,
      // so the switch can't be seen) the circle takes over, already closed, and opens out.
      const t2 = S.inTime, tMid = t2 + S.centerPause / 2, t4 = t2 + S.centerPause + S.outTime;
      const blink = 0.001; // seconds -- makes each hand-off instant instead of a blend
      css += `@keyframes boxInOnly {
        0% { --side: ${boxOff}; }
        ${pct(t2, cycle)}, ${pct(tMid, cycle)} { --side: 50%; }
        ${pct(tMid + blink, cycle)}, 100% { --side: ${boxOff}; }
      }
      @keyframes circleOutOnly {
        0%, ${pct(tMid - blink, cycle)} { --hole: 100%; }
        ${pct(tMid, cycle)}, ${pct(t2 + S.centerPause, cycle)} { --hole: ${circleCenter}; }
        ${pct(t4, cycle)}, 100% { --hole: 100%; }
      }`;
      boxEl.style.animation = `boxInOnly ${cycle}s linear ${S.startDelay}s infinite backwards`;
      circleEl.style.animation = `circleOutOnly ${cycle}s linear ${S.startDelay}s infinite backwards`;
    } else if (S.shape === 'box' || S.shape === 'alternate') {
      css += shapeKeyframes('boxClose', '--side', boxOff, '50%', shapeTotal, 0);
      boxEl.style.animation = `boxClose ${shapeTotal}s linear ${S.startDelay}s infinite backwards`;
    } else {
      boxEl.style.display = 'none';
    }

    if (S.shape === 'box-in-circle-out') {
      // both shapes already set up above
    } else if (S.shape === 'circle' || S.shape === 'alternate') {
      const circleStart = S.shape === 'alternate' ? cycle : 0;   // alternate: circle takes the second pass
      css += shapeKeyframes('circleClose', '--hole', '100%', circleCenter, shapeTotal, circleStart);
      circleEl.style.animation = `circleClose ${shapeTotal}s linear ${S.startDelay}s infinite backwards`;
    } else {
      circleEl.style.display = 'none';
    }

    // ===== words: each inward pass dissolves to the next phrase in the list
    // (back to the first after the last), finishing at wordFadeEnd. The old phrase fades
    // all the way out first, then the new one fades in -- each takes half of wordFade. =====
    const wordsEl = document.getElementById('words');
    const fadeEnd = S.inTime + S.wordFadeEnd;
    const fadeStart = Math.max(0, fadeEnd - S.wordFade);
    const fadeMs = (fadeEnd - fadeStart) * 1000;

    const wordSpan = document.createElement('span');
    wordSpan.style.transition = `opacity ${fadeMs / 2}ms linear`;
    wordsEl.appendChild(wordSpan);
    let currentWord = '';
    wordSpan.style.opacity = 1;

    let wordIndex = 0;   // which phrase in the list is showing
    function pickNextWord() {
      wordIndex = (wordIndex + 1) % S.words.length;   // next one, back to the first after the last
      return S.words[wordIndex];
    }

    function swapWord() {
      currentWord = pickNextWord();
      wordSpan.style.opacity = 0;                // fade the old phrase out...
      setTimeout(() => {
        wordSpan.innerHTML = currentWord;        // ...then swap in the new one (innerHTML, so tags like <em> work)
        wordSpan.style.opacity = 1;              // and fade it in
      }, fadeMs / 2);
    }

    // schedule each swap from the page's start time (not one after another),
    // so the timing stays lined up with the shape's passes
    const pageStart = performance.now();
    let passNumber = 0;
    function scheduleNextSwap() {
      const at = pageStart + (S.startDelay + passNumber * cycle + fadeStart) * 1000;
      setTimeout(() => { swapWord(); passNumber++; scheduleNextSwap(); },
                 Math.max(0, at - performance.now()));
    }

    // load the phrases from arrays/nothing-array.txt: skip the header line. A blank line
    // is kept as an empty phrase (that pass shows no words). \r? handles the file being
    // saved with Windows/Excel-style line endings.
    fetch('arrays/nothing-array.txt')
      .then(r => r.text())
      .then(text => {
        S.words = text.split(/\r?\n/).slice(1).map(line => line.trim());
        // the file's own final line break leaves one empty item at the end -- that's
        // not a blank line in the list, so drop it
        if (S.words.length && S.words[S.words.length - 1] === '') S.words.pop();
        if (!S.words.length) return;
        currentWord = S.words[0];
        wordSpan.innerHTML = currentWord;
        if (S.words.length > 1) scheduleNextSwap();
      })
      .catch(err => console.error('nothing-array.txt failed to load', err));

    // ===== colors: switch to the next color at the start of each pass
    // (the shape is out at the edges then), for both the shape and the words/arrows =====
    // a color from the screen color wheel: hue in degrees, saturation and brightness in %.
    // Gives back the same rgb(r% g% b%) form used in the .css files.
    function wheelColor(hue, sat, bright) {
      const h = ((hue % 360) + 360) % 360 / 60, s = sat / 100, v = bright;
      const part = n => { const k = (n + h) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
      return `rgb(${part(5).toFixed(1)}% ${part(3).toFixed(1)}% ${part(1).toFixed(1)}%)`;
    }

    if (S.shape === 'box-in-disc-out') {
      const passes = boxColors.length;
      root.setProperty('--wipe-color', boxColors[0]);
      root.setProperty('--disc-color', discColors[0]);
      root.setProperty('--text-color', boxColors[0]);   // first pass, on the white page

      const colorTotal = passes * cycle;
      const justBefore = 0.001; // seconds -- makes each switch instant instead of a blend
      const segment = i => `${pct(i * cycle, colorTotal)}, ${pct((i + 1) * cycle - justBefore, colorTotal)}`;
      // box and disc: switch at the start of each pass (box at the edges, disc gone)
      css += '@keyframes pairSwap {' + boxColors.map((c, i) =>
        `${segment(i)} { --wipe-color: ${c}; --disc-color: ${discColors[i]}; }`).join(' ') + '}';
      // page and words: switch when the disc fills the screen. The page takes this pass's
      // disc color; the words take the color across from it (this pass's box color).
      // Until the first switch the page stays white (pageColor).
      css += '@keyframes underSwap {' + discColors.map((c, i) =>
        `${segment(i)} { --page-color: ${c}; --text-color: ${boxColors[i]}; }`).join(' ') + '}';
      document.documentElement.style.animation =
        `pairSwap ${colorTotal}s linear ${S.startDelay}s infinite backwards, ` +
        `underSwap ${colorTotal}s linear ${S.startDelay + discFull - justBefore}s infinite`;
    } else if (S.colors.length > 1) {
      const colorTotal = S.colors.length * cycle;
      const justBefore = 0.001; // seconds -- makes each switch instant instead of a blend
      css += '@keyframes colorSwap {' + S.colors.map((c, i) => {
        const from = pct(i * cycle, colorTotal);
        const to = pct((i + 1) * cycle - justBefore, colorTotal);
        return `${from}, ${to} { --wipe-color: ${c}; --text-color: ${c}; }`;
      }).join(' ') + '}';
      document.documentElement.style.animation =
        `colorSwap ${colorTotal}s linear ${S.startDelay}s infinite backwards`;
    }

    const styleEl = document.createElement('style');
    styleEl.textContent = css;
    document.head.appendChild(styleEl);

    // ===== page reveal (unchanged from before) =====
    const contentBox = document.querySelector('.content-box');
    const textStack = document.getElementById('text-stack');
    const lines = Array.from(textStack.querySelectorAll('p'));

    requestAnimationFrame(() => {
      contentBox.classList.add('revealed');
      lines[0].classList.add('revealed');
    });

    let nextLineIndex = 1;
    function checkLineReveals() {
      while (nextLineIndex < lines.length &&
             lines[nextLineIndex - 1].getBoundingClientRect().bottom <= 0) {
        lines[nextLineIndex].classList.add('revealed');
        nextLineIndex++;
      }
    }

    // ===== scroll-driven growth: the box's bottom edge always tracks the bottom
    // of the current viewport, so it keeps expanding as you scroll further down. =====
    function updateBoxHeight() {
      const boxTop = contentBox.getBoundingClientRect().top + window.scrollY;
      const newHeight = Math.max(200, window.innerHeight + window.scrollY - boxTop);
      contentBox.style.height = newHeight + 'px';
    }

    updateBoxHeight();
    window.addEventListener('scroll', () => {
      updateBoxHeight();
      checkLineReveals();
    });
    window.addEventListener('resize', updateBoxHeight);

  </script>

</body>
</html>
