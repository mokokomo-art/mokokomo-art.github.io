<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Art</title>
  <link rel="stylesheet" href="placeholder.css">
</head>
<body class="nothing-page">

  <button id="menu-toggle" type="button" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>

  <nav id="drawer"></nav>

  <div class="content-box"><div class="text-stack" id="text-stack"></div><div class="down-arrow" aria-hidden="true">&#8595;</div></div>

  <script>
    // reveal the blank box immediately -- same box/animation as index.html's, just
    // without the grid intro sequence to wait for first
    const contentBox = document.querySelector('.content-box');
    const textStack = document.getElementById('text-stack');

    // ===== stacked reveal lines: the first line shows immediately; each next
    // line fades in once the line before it has fully scrolled above the top
    // of the screen. Add more strings here for more lines later. =====
    const PHRASES = [
      'this space left intentionally blank',
      'also intentionally blank'
    ];

    const lines = PHRASES.map(text => {
      const p = document.createElement('p');
      p.className = 'reveal-text';
      p.textContent = text;
      textStack.appendChild(p);
      return p;
    });

    requestAnimationFrame(() => {
      contentBox.classList.add('revealed');
      lines[0].classList.add('revealed');
    });

    let nextLineIndex = 1;
    function checkLineReveals() {
      while (nextLineIndex < lines.length &&
             lines[nextLineIndex - 1].getBoundingClientRect().bottom <= 0) {
        lines[nextLineIndex].classList.add('revealed');
        nextLineIndex++;
      }
    }

    // ===== scroll-driven growth: the box's bottom edge always tracks the bottom
    // of the current viewport, so it keeps expanding as you scroll further down. =====
    function updateBoxHeight() {
      const boxTop = contentBox.getBoundingClientRect().top + window.scrollY;
      const newHeight = Math.max(200, window.innerHeight + window.scrollY - boxTop);
      contentBox.style.height = newHeight + 'px';
    }

    updateBoxHeight();
    window.addEventListener('scroll', () => {
      updateBoxHeight();
      checkLineReveals();
    });
    window.addEventListener('resize', updateBoxHeight);

    const toggle = document.getElementById('menu-toggle');
    const drawer = document.getElementById('drawer');

    toggle.addEventListener('click', () => {
      document.body.classList.toggle('menu-open');
    });

    document.addEventListener('pointerdown', e => {
      if (!e.target.closest('#drawer') && !e.target.closest('#menu-toggle')) {
        document.body.classList.remove('menu-open');
      }
    });

    // ===== drawer: built entirely from arrays/menu-array.txt, in file order.
    // Each row's Action says what happens on click:
    //   goto  -> plain link straight to a page (home, about, nothing, coming-soon)
    //   union -> art-display.html filtered to one or more categories, OR'd together (Value is
    //            a comma-separated list of category IDs from arrays/category-array.txt --
    //            a single ID is just a union of one)
    //   chron -> art-display.html's fixed chronological view (sections 1+2, newest first)
    function parseMenu(text) {
      return text.trim().split(/\r?\n/).slice(1).map(line => {
        const [name, action, value] = line.split('\t');
        return { name, action, value: value || '' };
      });
    }

    fetch('arrays/menu-array.txt')
      .then(r => r.text())
      .then(parseMenu)
      .then(items => {
        items.forEach(({ name, action, value }) => {
          const a = document.createElement('a');
          a.innerHTML = name; // menu-array.txt names can include plain HTML, e.g. <br>
          a.href = (action === 'union' || action === 'chron')
            ? `art-display.html?section=${action === 'chron' ? 'chron' : value}`
            : value;
          a.addEventListener('click', () => document.body.classList.remove('menu-open'));
          drawer.appendChild(a);
        });
      })
      .catch(err => console.error('menu-array.txt failed to load', err));
  </script>

</body>
</html>
