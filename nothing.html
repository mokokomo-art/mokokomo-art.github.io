<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Art</title>
  <link rel="stylesheet" href="placeholder.css">
</head>
<body class="nothing-page">

  <button id="menu-toggle" type="button" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>

  <nav id="drawer">
    <a href="index.html">home</a>
  </nav>

  <div class="content-box"><p class="reveal-text">this space left intentionally blank</p></div>

  <script>
    // reveal the blank box immediately -- same box/animation as index.html's, just
    // without the grid intro sequence to wait for first
    const contentBox = document.querySelector('.content-box');
    const revealText = document.querySelector('.reveal-text');
    requestAnimationFrame(() => {
      contentBox.classList.add('revealed');
      revealText.classList.add('revealed');
    });

    const toggle = document.getElementById('menu-toggle');
    const drawer = document.getElementById('drawer');

    toggle.addEventListener('click', () => {
      document.body.classList.toggle('menu-open');
    });

    document.addEventListener('pointerdown', e => {
      if (!e.target.closest('#drawer') && !e.target.closest('#menu-toggle')) {
        document.body.classList.remove('menu-open');
      }
    });

    drawer.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        document.body.classList.remove('menu-open');
      });
    });
  </script>

</body>
</html>
