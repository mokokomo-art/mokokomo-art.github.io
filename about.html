<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Art &mdash; About</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="about.css">
</head>
<body>

  <div id="menu-bar"></div>

  <button id="menu-toggle" type="button" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>

  <nav id="drawer"></nav>

  <!-- the sections are built from arrays/about-text.txt by the script below -->
  <div class="gallery" id="about"></div>

  <script src="script.js"></script>
  <script>
    // ===== build the page from arrays/about-text.txt =====
    // Rules for the text file:
    //   a line starting with "about " -> starts a new box, with that line as its heading
    //   any other line                -> one paragraph in the current box
    //   blank lines                   -> ignored (use them freely to keep the file readable)
    // Lines can include plain HTML if ever wanted, e.g. <i>word</i> for italics.
    fetch('arrays/about-text.txt')
      .then(r => r.text())
      .then(text => {
        const page = document.getElementById('about');
        let box = null;
        text.split(/\r?\n/).forEach(line => {
          line = line.trim();
          if (line === '') return;
          if (line.startsWith('about ') || !box) {
            box = document.createElement('div');
            box.className = 'box prose';
            page.appendChild(box);
          }
          const p = document.createElement('p');
          if (line.startsWith('about ')) p.className = 'head';
          p.innerHTML = line;
          box.appendChild(p);
        });
      })
      .catch(err => console.error('about-text.txt failed to load', err));
  </script>

</body>
</html>
