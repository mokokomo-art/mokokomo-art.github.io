<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Art</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="other-things-display.css">
</head>
<body>

  <div id="menu-bar"></div>

  <button id="menu-toggle" type="button" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>

  <nav id="drawer"></nav>

  <div class="gallery" id="gallery"></div>

  <!-- pop-up box for showing another website without leaving this page -->
  <div id="frame-overlay" hidden>
    <div id="frame-box">
      <!-- the only ways out of the box: stay here, or go to the linked site -->
      <div id="frame-buttons">
        <button id="frame-go" type="button"></button>
        <button id="frame-stay" type="button">stay with mk</button>
      </div>
      <iframe id="frame-view" title="linked website"></iframe>
      <!-- clear layer over the website: clicks on the website itself do nothing -->
      <div id="frame-click"></div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    // ===== data loading =====
    // arrays/other-things-array.txt is the live source data, same tab-delimited format
    // as photo-array.txt, saved as UTF-8.
    // This page lists every item in category-Order. It shows one fixed intro block,
    // category ID 6 ("other things") from category-array.txt/category-intro-array.txt.

    function parseDelimited(text) {
      const rows = [];
      let row = [], field = '', inQuotes = false;
      text = text.replace(/\r\n/g, '\n');
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
          if (c === '"') {
            if (text[i + 1] === '"') { field += '"'; i++; }
            else { inQuotes = false; }
          } else {
            field += c;
          }
        } else {
          if (c === '"') { inQuotes = true; }
          else if (c === '\t') { row.push(field); field = ''; }
          else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
          else { field += c; }
        }
      }
      if (field.length || row.length) { row.push(field); rows.push(row); }
      return rows.filter(r => !(r.length === 1 && r[0] === ''));
    }

    function rowsToObjects(rows) {
      const header = rows[0];
      return rows.slice(1).map(r => {
        const obj = {};
        header.forEach((h, i) => obj[h] = (r[i] ?? '').trim());
        return obj;
      });
    }

    function buildThingInfo(rows) {
      return rowsToObjects(rows).map(r => ({
        id: Number(r['ID-num']),
        piece: r['Piece'],
        file: r['File Name'],
        subcategory: (r['Sub Category'] || '').trim(),
        order: Number(r['category Order']),
        date: r['date-opus'],
        size: r['size'],
        info: r['info']
      }));
    }

    // category-array.txt: ID<TAB>Name per row, header first.
    function parseCategoryNames(text) {
      const names = {};
      text.trim().split(/\r?\n/).slice(1).forEach(line => {
        const [id, name] = line.split('\t');
        names[Number(id)] = name;
      });
      return names;
    }

    // category-intro-array.txt: [ID] on its own line, then the intro text.
    function parseIntroText(text) {
      const intros = {};
      const re = /\[(\d+)\]\r?\n([\s\S]*?)(?=\r?\n\[\d+\]\r?\n|$)/g;
      let m;
      while ((m = re.exec(text)) !== null) intros[Number(m[1])] = m[2].trim();
      return intros;
    }

    // this page always shows one fixed intro -- category 6, "other things" --
    // it isn't filtered by category the way art-display.html's union views are.
    const CATEGORY_ID = 6;

    let THING_INFO = [];
    let CATEGORY_NAMES = {};
    let INTROS = {};

    const dataReady = Promise.all([
      fetch('arrays/other-things-array.txt')
        .then(r => r.text()) // other-things-array.txt is UTF-8
        .then(parseDelimited)
        .then(buildThingInfo),
      window.menuReady, // parsed + drawer already built by the shared script.js
      fetch('arrays/category-array.txt').then(r => r.text()).then(parseCategoryNames),
      fetch('arrays/category-intro-array.txt').then(r => r.text()).then(parseIntroText)
    ]).then(([thingInfo, menu, categoryNames, intros]) => {
      THING_INFO = thingInfo;
      CATEGORY_NAMES = categoryNames;
      INTROS = intros;
    }).catch(err => console.error('failed to load other things data', err));

    // ===== gallery rendering =====
    const gallery = document.getElementById('gallery');

    function renderGallery() {
      gallery.innerHTML = '';
      window.scrollTo(0, 0);

      // the heading shows even while the intro text in category-intro-array.txt is empty
      if (CATEGORY_NAMES[CATEGORY_ID]) {
        const intro = document.createElement('div');
        intro.className = 'category-intro';

        const heading = document.createElement('p');
        heading.className = 'category-intro-heading';
        heading.textContent = CATEGORY_NAMES[CATEGORY_ID] || '';
        intro.appendChild(heading);

        // each blank-line-separated block of the intro text becomes its own paragraph,
        // so the space between paragraphs can be set in CSS (.category-intro-body margin)
        (INTROS[CATEGORY_ID] || '').split(/\n\s*\n/).filter(para => para.trim()).forEach(para => {
          const body = document.createElement('p');
          body.className = 'category-intro-body';
          body.innerHTML = para.replace(/\n/g, '<br>');
          intro.appendChild(body);
        });

        gallery.appendChild(intro);
      }

      // a "category Order" of 0 in other-things-array.txt means leave this item out
      const pieces = THING_INFO
        .filter(thing => thing.order !== 0)
        .sort((a, b) => a.order - b.order);

      // small items: any piece with something in its Sub Category column (other-things-array.txt)
      // goes in a 400px box. Small items next to each other in the order with the SAME
      // Sub Category share a row, side by side, wrapping onto more rows when the page is too
      // narrow (see .small-row in other-things-display.css). A different Sub Category starts
      // a new row, so clocks and coasters never share one.
      let smallRow = null;       // the row the current run of small items is going into
      let rowSubcategory = '';   // that row's Sub Category

      pieces.forEach(thing => {
        const box = document.createElement('div');
        box.className = 'box';

        const img = document.createElement('img');
        img.src = 'images/other-things images/' + thing.file;
        img.alt = '';
        box.appendChild(img);

        // the Piece name under the image, same caption style as art-display.html
        const caption = document.createElement('div');
        caption.className = 'caption';
        const title = document.createElement('p');
        title.className = 'title';
        title.textContent = thing.piece;
        caption.appendChild(title);
        box.appendChild(caption);

        if (thing.subcategory) {
          if (!smallRow || thing.subcategory !== rowSubcategory) {   // start a new row
            rowSubcategory = thing.subcategory;
            smallRow = document.createElement('div');
            smallRow.className = 'small-row';
            gallery.appendChild(smallRow);
          }
          smallRow.appendChild(box);
        } else {
          smallRow = null;                       // a full-size item ends the run
          gallery.appendChild(box);
        }
      });
    }

    dataReady.then(renderGallery);

    // ===== pop-up box for links marked class="frame-link" in the intro text =====
    const frameOverlay = document.getElementById('frame-overlay');
    const frameView = document.getElementById('frame-view');

    const frameGo = document.getElementById('frame-go');
    const frameStay = document.getElementById('frame-stay');

    let frameUrl = '';

    // label = text for the "go" button, from the link's data-label
    function openFrame(url, label) {
      frameUrl = url;
      frameGo.textContent = label || 'go to this page';
      frameView.src = url;
      frameOverlay.hidden = false;
    }

    // "go" button: open the linked site in a new tab, and close the box here
    frameGo.addEventListener('click', () => {
      window.open(frameUrl, '_blank', 'noopener');
      closeFrame();
    });

    function closeFrame() {
      frameOverlay.hidden = true;
      frameView.src = 'about:blank';
    }

    // a click on a frame-link opens the pop-up box instead of leaving the site
    gallery.addEventListener('click', e => {
      const link = e.target.closest('a.frame-link');
      if (!link) return;
      e.preventDefault();
      openFrame(link.href, link.dataset.label);
    });

    // rolling over (or tapping) a superscript number marked class="frame-note"
    // opens the same pop-up box, showing the address in its data-url
    gallery.addEventListener('mouseover', e => {
      const note = e.target.closest('.frame-note');
      if (note && frameOverlay.hidden) openFrame(note.dataset.url, note.dataset.label);
    });
    gallery.addEventListener('click', e => {
      const note = e.target.closest('.frame-note');
      if (note && frameOverlay.hidden) openFrame(note.dataset.url, note.dataset.label);
    });

    // "stay here" button closes the box
    frameStay.addEventListener('click', closeFrame);

  </script>

</body>
</html>
